name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Arrange project files
        run: |
          P=proj
          J=$P/app/src/main/java/com/example/talktranslate
          R=$P/app/src/main/res
          mkdir -p $J $R/layout $R/drawable $R/values
          cat > $P/settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TalkTranslate"
          include(":app")
          EOF
          cat > $P/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > $P/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > $P/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.talktranslate"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.talktranslate"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          EOF
          cp AndroidManifest.xml $P/app/src/main/
          cp MainActivity.kt $J/
          sed -i 's/finish()/finalizeResult()/g' $J/MainActivity.kt
          cp activity_main.xml $R/layout/
          cp bg_button.xml ic_launcher.xml $R/drawable/
          cp colors.xml strings.xml themes.xml $R/values/
          find $P -type f

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TalkTranslate-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
